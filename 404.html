 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <title>Redirecting...</title>
     <script>
         // Redirect to new domain with same path
         const newDomain = "https://mechres.dev";
         const currentPath = window.location.pathname;
         window.location.replace(newDomain + currentPath);
     </script>
 </head>
 <body>
     <p>Redirecting to new site...</p>
 </body>
 </html>
